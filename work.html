  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品 — JIAXIN DESIGN STUDIOS</title>

      <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="JX LOGO (1).png" alt="JIA XIN DESIGN" />
      <div class="nav-brand">JIAXIN DESIGN<span>STUDIOS</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="program.html" class="active">Program</a></li>
      <li><a href="index.html#events">Events</a></li>
      <li><a href="index.html#community">Community</a></li>
    </ul>
    <button id="loginBtn" class="btn btn-outline">登入 Login</button>
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu" aria-expanded="false">

    </button>
  </nav>

  <!-- 手機導覽側拉選單 -->
  <div class="nav-mobile" id="navMobile">
    <a href="index.html#about">About</a>
    <a href="program.html" class="active">Program</a>
    <a href="index.html#events">Events</a>
    <a href="index.html#community">Community</a>
  </div>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- Work Header -->
  <header class="work-header">
    <div class="work-header-bg" id="workHeaderBg"></div>
    <div class="work-header-content">
      <a href="program.html" class="work-back" id="workBreadcrumb">← 返回分類</a>
      <div class="work-cat-badge" id="workCatBadge"></div>
      <h1 class="prog-title" id="workTitle">—</h1>
      <p class="prog-sub" id="workTitleEn"></p>
    </div>
  </header>

  <!-- Admin toolbar -->
  <div class="prog-toolbar admin-only" style="display:none">
    <button class="btn btn-primary" onclick="openEditWork()">✏ 編輯此作品</button>
    <button class="btn btn-outline" style="color:#ff6644;border-color:#ff664466" onclick="removeWork()">✕ 刪除作品</button>
  </div>

  <!-- Work body — DM layout -->
  <section class="work-body-section">
    <div class="dm-container" id="workDMLayout"></div>
    <button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到頂部 Back to Top</button>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" onclick="event.stopPropagation()" />
  </div>

  <!-- Edit Work Modal -->
  <div class="prog-modal" id="workEditModal">
    <div class="prog-modal-box">
      <button class="prog-modal-close" onclick="closeEditWork()">✕</button>
      <h2>編輯作品</h2>
      <form id="workEditForm">
        <div class="prog-field-row">
          <div class="prog-field">
            <label>作品名稱（中文）*</label>
            <input type="text" id="ewTitle" placeholder="動態宣傳影片" required />
          </div>
          <div class="prog-field">
            <label>Work Name (English)</label>
            <input type="text" id="ewTitleEn" placeholder="Promo Video" />
          </div>
        </div>
        <div class="prog-field">
          <label>縮圖 URL Thumbnail</label>
          <input type="text" id="ewThumb" placeholder="image/img/cover.jpg 或貼上完整路徑" />
          <div class="thumb-lib">
            <button type="button" class="thumb-lib-btn" onclick="toggleEWThumbLib()">📷 從縮圖庫選取</button>
            <div id="ewThumbLib" class="thumb-lib-panel" style="display:none"></div>
          </div>
        </div>
        <div class="prog-field-row">
          <div class="prog-field">
            <label>作品簡介（中文，約50字）</label>
            <textarea id="ewDesc" rows="3" maxlength="150"></textarea>
          </div>
          <div class="prog-field">
            <label>Description (English)</label>
            <textarea id="ewDescEn" rows="3" maxlength="300"></textarea>
          </div>
        </div>
        <div class="prog-field">
          <label>圖片 URLs（每行一個）</label>
          <textarea id="ewImages" rows="3" placeholder="image/contentimg/photo.jpg&#10;https://example.com/image2.jpg"
            oninput="renderEWImgPreview()"></textarea>
          <div class="thumb-lib">
            <button type="button" class="thumb-lib-btn" onclick="toggleEWContentLib()">🖼 從內文圖庫選取（多選）</button>
            <div id="ewContentLib" class="thumb-lib-panel" style="display:none"></div>
          </div>
          <!-- Live preview -->
          <div id="ewImgPreview" class="img-preview-grid"></div>
        </div>
        <div class="prog-field">
          <label>影音連結 Videos（YouTube / Vimeo / MP4，每行一個）</label>
          <textarea id="ewVideos" rows="3" placeholder="https://youtube.com/watch?v=...&#10;https://vimeo.com/12345678"></textarea>
        </div>
        <div class="prog-field">
          <label>附件檔案 Files（每行格式：名稱 | URL）</label>
          <textarea id="ewFiles" rows="3" placeholder="設計稿 PDF|https://example.com/file.pdf"></textarea>
        </div>
        <div class="prog-field">
          <label>標籤 Tags（逗號分隔，可留空自動產生）</label>
          <input type="text" id="ewTags" placeholder="設計, 影像, 互動" />
        </div>
        <div class="prog-field">
          <label>詳細內容 Content（HTML 可用）</label>
          <textarea id="ewContent" rows="4" placeholder="詳細介紹…"></textarea>
        </div>
        <div class="prog-modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeEditWork()">取消</button>
          <button type="submit" class="btn btn-primary">儲存變更</button>
        </div>
      </form>
    </div>
  </div>
  <div class="prog-modal-backdrop" id="workEditBackdrop" onclick="closeEditWork()"></div>

  <!-- Login Modal -->
  <div class="auth-modal" id="loginModal">
    <div class="auth-modal-box">
      <button class="auth-close" onclick="closeLoginModal()">✕</button>
      <h2>管理員登入</h2>
      <p class="auth-sub">Admin Login</p>
      <form id="loginForm" autocomplete="off">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="new-password" required />
        </div>
        <div class="auth-field">
          <label>密碼 Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <div id="loginError" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">登入 Login</button>
      </form>
    </div>
  </div>

  <!-- Cursor -->
  <div class="cursor-glow-wrap">
    <div class="glow outer"></div>
    <div class="glow inner"></div>
  </div>

  <script src="sanitize.js"></script>
  <script src="jiaxin-core.js"></script>
  <script src="loader.js"></script>
  <script>
  // ── Path Normalizer ───────────────────────────────────────────────
  let _ewRoot = '';
  fetch('/api/root').then(r => r.json()).then(d => {
    _ewRoot = (d.root || '').replace(/\\/g, '/').replace(/\/+$/, '');
  }).catch(() => {});

  function ewNormPath(raw) {
    const p = (raw || '').trim();
    if (!p || /^https?:\/\//i.test(p)) return p;
    let s = p.replace(/\\/g, '/');
    if (_ewRoot) {
      const root = _ewRoot.replace(/\\/g, '/').replace(/\/+$/, '');
      if (s.toLowerCase().startsWith(root.toLowerCase()))
        return s.slice(root.length).replace(/^\/+/, '');
    }
    const m = s.match(/^[A-Za-z]:\/(?:[^\/]+\/)*?claudecode\/(.+)$/i);
    if (m) return m[1];
    return s;
  }

  // ── Thumbnail Library (image/img → ewThumb) ───────────────────────
  let _ewThumbCache = null;

  async function toggleEWThumbLib() {
    const panel = document.getElementById('ewThumbLib');
    if (!panel) return;
    if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    if (_ewThumbCache === null) {
      panel.innerHTML = '<div class="fs-status">⟳ 載入縮圖庫…</div>';
      try {
        const r = await fetch('/api/list-images?path=image/img');
        const d = await r.json();
        _ewThumbCache = d.images || [];
      } catch { _ewThumbCache = []; }
    }
    renderEWThumbLib();
  }

  async function ewRefreshThumbLib() {
    _ewThumbCache = null;
    const panel = document.getElementById('ewThumbLib');
    if (panel) panel.innerHTML = '<div class="fs-status">⟳ 重新整理…</div>';
    try {
      const r = await fetch('/api/list-images?path=image/img');
      const d = await r.json();
      _ewThumbCache = d.images || [];
    } catch { _ewThumbCache = []; }
    renderEWThumbLib();
  }

  function renderEWThumbLib() {
    const panel = document.getElementById('ewThumbLib');
    const curVal = (document.getElementById('ewThumb')?.value || '').trim();
    if (!_ewThumbCache?.length) {
      panel.innerHTML = `
        <div class="thumb-lib-header">
          <span class="fs-status" style="margin:0">📂 縮圖庫尚無圖片（image/img 資料夾為空）</span>
          <button type="button" class="thumb-lib-refresh" onclick="ewRefreshThumbLib()">↺ 重新整理</button>
        </div>`;
      return;
    }
    panel.innerHTML = `
      <div class="thumb-lib-header">
        <span class="fs-status" style="margin:0">縮圖庫 — ${_ewThumbCache.length} 張</span>
        <button type="button" class="thumb-lib-refresh" onclick="ewRefreshThumbLib()">↺ 重新整理</button>
      </div>
      <div class="fs-grid">
        ${_ewThumbCache.map(img => `
          <div class="fs-img ${img.path === curVal ? 'thumb' : ''}"
               onclick="ewPickThumb('${img.path}')" title="${img.name}">
            <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
            ${img.path === curVal ? '<span class="fs-thumb-badge">已選</span>' : ''}
            <span class="fs-img-name">${img.name}</span>
          </div>`).join('')}
      </div>
      <div class="fs-hint">單擊圖片以設為縮圖</div>`;
  }

  function ewPickThumb(path) {
    const el = document.getElementById('ewThumb');
    if (el) { el.value = path; el.style.borderColor = 'rgba(0,238,221,0.7)'; setTimeout(() => { el.style.borderColor = ''; }, 1200); }
    renderEWThumbLib();
  }

  // ── Content Image Library (image/contentimg → ewImages) ───────────
  let _ewContentCache = null;
  let _ewContentSel = new Set();

  async function toggleEWContentLib() {
    const panel = document.getElementById('ewContentLib');
    if (!panel) return;
    if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    if (_ewContentCache === null) {
      panel.innerHTML = '<div class="fs-status">⟳ 載入內文圖庫…</div>';
      try {
        const r = await fetch('/api/list-images?path=image/contentimg');
        const d = await r.json();
        _ewContentCache = d.images || [];
        const existing = new Set(
          (document.getElementById('ewImages')?.value || '')
            .split('\n').map(s => s.trim()).filter(Boolean)
        );
        _ewContentSel = new Set(
          _ewContentCache.map((img, i) => existing.has(img.path) ? i : -1).filter(i => i >= 0)
        );
      } catch { _ewContentCache = []; }
    }
    renderEWContentLib();
  }

  async function ewRefreshContentLib() {
    _ewContentCache = null; _ewContentSel = new Set();
    const panel = document.getElementById('ewContentLib');
    if (panel) panel.innerHTML = '<div class="fs-status">⟳ 重新整理…</div>';
    try {
      const r = await fetch('/api/list-images?path=image/contentimg');
      const d = await r.json();
      _ewContentCache = d.images || [];
      _ewContentSel = new Set(_ewContentCache.map((_,i) => i));
    } catch { _ewContentCache = []; }
    renderEWContentLib();
  }

  function renderEWContentLib() {
    const panel = document.getElementById('ewContentLib');
    if (!_ewContentCache?.length) {
      panel.innerHTML = `
        <div class="thumb-lib-header">
          <span class="fs-status" style="margin:0">📂 內文圖庫尚無圖片（image/contentimg 資料夾為空）</span>
          <button type="button" class="thumb-lib-refresh" onclick="ewRefreshContentLib()">↺ 重新整理</button>
        </div>`;
      return;
    }
    panel.innerHTML = `
      <div class="thumb-lib-header">
        <span class="fs-status" style="margin:0">內文圖庫 — ${_ewContentCache.length} 張</span>
        <button type="button" class="thumb-lib-refresh" onclick="ewRefreshContentLib()">↺ 重新整理</button>
      </div>
      <div class="fs-grid">
        ${_ewContentCache.map((img, i) => `
          <div class="fs-img ${_ewContentSel.has(i) ? 'sel' : ''}"
               onclick="ewContentToggle(${i})" title="${img.name}">
            <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
            ${_ewContentSel.has(i) ? '<span class="fs-check-badge">✓</span>' : ''}
            <span class="fs-img-name">${img.name}</span>
          </div>`).join('')}
      </div>
      <div class="fs-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="ewContentApply()">✓ 套用至圖片欄位</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="ewContentAll()">全選</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="ewContentClear()">取消全選</button>
      </div>
      <div class="fs-hint">單擊 = 選取／取消 &nbsp;·&nbsp; 套用後取代現有欄位</div>`;
  }

  function ewContentToggle(i) {
    if (_ewContentSel.has(i)) _ewContentSel.delete(i); else _ewContentSel.add(i);
    renderEWContentLib();
    _ewPreviewFromGallery();
  }
  function ewContentAll()   { _ewContentSel = new Set(_ewContentCache.map((_,i)=>i)); renderEWContentLib(); _ewPreviewFromGallery(); }
  function ewContentClear() { _ewContentSel = new Set(); renderEWContentLib(); _ewPreviewFromGallery(); }

  function ewContentApply() {
    if (!_ewContentCache?.length) return;
    const paths = [..._ewContentSel].sort((a,b)=>a-b).map(i => _ewContentCache[i].path);
    const ta = document.getElementById('ewImages');
    if (ta) { ta.value = paths.join('\n'); ta.style.borderColor = 'rgba(0,238,221,0.7)'; setTimeout(() => { ta.style.borderColor = ''; }, 1200); }
    _ewPreviewUrls(paths);
  }

  // ── Live Image Preview ────────────────────────────────────────────
  function _ewPreviewFromGallery() {
    if (!_ewContentCache) return;
    const paths = [..._ewContentSel].sort((a,b)=>a-b).map(i => _ewContentCache[i].path);
    _ewPreviewUrls(paths);
  }

  function renderEWImgPreview() {
    const urls = (document.getElementById('ewImages')?.value || '')
      .split('\n').map(s => ewNormPath(s)).filter(Boolean);
    _ewPreviewUrls(urls);
  }

  function _ewPreviewUrls(urls) {
    const box = document.getElementById('ewImgPreview');
    if (!box) return;
    if (!urls.length) { box.innerHTML = ''; return; }
    box.innerHTML = urls.map(url => {
      const safe = url.replace(/"/g, '%22');
      return `<div class="img-preview-item"><img src="${safe}" loading="lazy"
        onerror="this.parentElement.classList.add('broken')" /></div>`;
    }).join('');
  }

  function hexRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  const workId = new URLSearchParams(window.location.search).get('id');
  let currentWork = null;
  let currentCat  = null;

  async function initPage() {
    await _dataReady;
    if (!workId) { location.href = 'program.html'; return; }
    currentWork = getWorks().find(w => w.id === workId);
    if (!currentWork) { location.href = 'program.html'; return; }

    const cats = getProjects();
    currentCat = cats.find(c => c.id === currentWork.catId) || {};
    const clr     = currentCat.color || '#00aaff';
    const safeClr = sanitizeColor(clr);

    // Breadcrumb back link
    const bc = document.getElementById('workBreadcrumb');
    bc.textContent = '← ' + (currentCat.title || 'Program');
    bc.href = currentCat.id ? 'category.html?id=' + currentCat.id : 'program.html';

    // Category badge（sanitize 防止 CSS/HTML 注入）
    document.getElementById('workCatBadge').innerHTML = `
      <span class="work-cat-dot" style="background:${safeClr};box-shadow:0 0 10px ${safeClr}"></span>
      <span class="work-cat-name" style="color:${safeClr}">${sanitizeHTML(currentCat.title || '')}</span>
      ${currentCat.titleEn ? `<span class="work-cat-divider">·</span><span class="work-cat-name" style="color:var(--gray)">${sanitizeHTML(currentCat.titleEn)}</span>` : ''}
    `;

    // Header gradient
    document.getElementById('workHeaderBg').style.background =
      `radial-gradient(ellipse 75% 55% at 50% 30%, ${hexRgba(safeClr, 0.13)} 0%, transparent 70%)`;

    document.title = currentWork.title + ' — JIAXIN';
    document.getElementById('workTitle').textContent  = currentWork.title;
    document.getElementById('workTitleEn').textContent = currentWork.titleEn || '';

    renderBody();
    authRefreshUI();
  }

  // ── DM Layout ─────────────────────────────────────────────────────
  function getEmbedUrl(url) {
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (yt) return 'https://www.youtube.com/embed/' + yt[1] + '?rel=0';
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if (vm) return 'https://player.vimeo.com/video/' + vm[1];
    return null;
  }

  function renderBody() {
    const w = currentWork;
    let html = '';
    let hasContent = false;

    // Description (frosted glass intro)
    if (w.desc || w.descEn) {
      html += `<div class="dm-desc-block">
        ${w.desc   ? `<p class="work-desc-zh">${sanitizeHTML(w.desc)}</p>`   : ''}
        ${w.descEn ? `<p class="work-desc-en">${sanitizeHTML(w.descEn)}</p>` : ''}
      </div>`;
      hasContent = true;
    }

    // Images at natural ratio — alternating widths for DM feel
    (w.images || []).forEach((url, i) => {
      const safeImg = sanitizeURL(url);
      if (!safeImg) return;
      const style = '';
      html += `<div class="dm-img-wrap" style="${style}">
        <img src="${safeImg}" alt="${sanitizeHTML(w.title)}" loading="lazy" onclick="openLightbox('${safeImg.replace(/'/g,"\\'")}')" />
      </div>`;
      hasContent = true;
    });

    // Videos
    (w.videos || []).forEach(url => {
      const embed = getEmbedUrl(url);
      if (embed) {
        // embed URL 由 getEmbedUrl() 正規表達式生成，僅含安全的 youtube/vimeo 路徑
        html += `<div class="dm-video-wrap"><iframe src="${embed}" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`;
      } else {
        const safeVid = sanitizeURL(url);
        if (!safeVid) return;
        if (/\.(mp4|webm|ogg)(\?|$)/i.test(safeVid)) {
          html += `<div class="dm-video-wrap"><video controls src="${safeVid}"></video></div>`;
        } else {
          html += `<a href="${safeVid}" target="_blank" rel="noopener noreferrer" class="dm-video-link">▶ 觀看影片 Watch Video</a>`;
        }
      }
      hasContent = true;
    });

    // Files（先過濾有效 URL，只有至少一個有效檔案時才渲染區塊）
    const validFiles = (w.files || []).filter(f => sanitizeURL(f.url || ''));
    if (validFiles.length) {
      html += `<div class="dm-files-block"><p class="dm-files-title">附件 / Attachments</p>`;
      validFiles.forEach(f => {
        html += `<a href="${sanitizeURL(f.url)}" target="_blank" rel="noopener noreferrer" class="dm-file-item">📎 ${sanitizeHTML(f.name)}</a>`;
      });
      html += `</div>`;
      hasContent = true;
    }

    // Full HTML content（管理員可輸入 HTML，為設計功能，信任邊界在管理員登入）
    if (w.content) {
      html += `<div class="dm-content">${w.content}</div>`;
      hasContent = true;
    }

    if (!hasContent) {
      html = `<div class="work-empty"><p>尚無詳細內容 / No content yet</p>${isAdmin()?'<p style="font-size:13px;margin-top:8px;color:var(--gray)">點擊上方「編輯此作品」新增說明與圖片。</p>':''}</div>`;
    }

    document.getElementById('workDMLayout').innerHTML = html;
  }

  // ── Edit ──────────────────────────────────────────────────────────
  // ── Lightbox ──────────────────────────────────────────────────────
  function openLightbox(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // ── Edit ──────────────────────────────────────────────────────────
  function openEditWork() {
    const w = currentWork;
    document.getElementById('ewTitle').value   = w.title   || '';
    document.getElementById('ewTitleEn').value = w.titleEn || '';
    document.getElementById('ewThumb').value   = w.thumb   || '';
    document.getElementById('ewDesc').value    = w.desc    || '';
    document.getElementById('ewDescEn').value  = w.descEn  || '';
    document.getElementById('ewImages').value  = (w.images  || []).join('\n');
    document.getElementById('ewVideos').value  = (w.videos  || []).join('\n');
    document.getElementById('ewFiles').value   = (w.files   || []).map(f => f.name + '|' + f.url).join('\n');
    document.getElementById('ewTags').value    = (w.tags    || []).join(', ');
    document.getElementById('ewContent').value = w.content || '';
    // Reset image lib state so it re-syncs to current images
    _ewThumbCache = null; _ewContentCache = null; _ewContentSel = new Set();
    ['ewThumbLib','ewContentLib'].forEach(id => { const p = document.getElementById(id); if (p) p.style.display = 'none'; });
    renderEWImgPreview();
    document.getElementById('workEditModal').classList.add('open');
    document.getElementById('workEditBackdrop').classList.add('open');
  }

  function closeEditWork() {
    document.getElementById('workEditModal').classList.remove('open');
    document.getElementById('workEditBackdrop').classList.remove('open');
    ['ewThumbLib','ewContentLib'].forEach(id => { const p = document.getElementById(id); if (p) p.style.display = 'none'; });
  }

  document.getElementById('workEditForm').addEventListener('submit', e => {
    e.preventDefault();
    const tagsInput = document.getElementById('ewTags').value.trim();
    const tagsArr   = tagsInput ? tagsInput.split(',').map(s => s.trim()).filter(Boolean) : [];
    const data = {
      title:   document.getElementById('ewTitle').value.trim(),
      titleEn: document.getElementById('ewTitleEn').value.trim(),
      thumb:   ewNormPath(document.getElementById('ewThumb').value),
      desc:    document.getElementById('ewDesc').value.trim(),
      descEn:  document.getElementById('ewDescEn').value.trim(),
      images:  document.getElementById('ewImages').value.split('\n').map(s => ewNormPath(s)).filter(Boolean),
      videos:  document.getElementById('ewVideos').value.split('\n').map(s => s.trim()).filter(Boolean),
      files:   parseFileList(document.getElementById('ewFiles').value),
      content: document.getElementById('ewContent').value.trim(),
    };
    data.tags = tagsArr.length ? tagsArr : autoGenerateTags(data);
    workUpdate(currentWork.id, data);
    Object.assign(currentWork, data);
    closeEditWork();
    document.getElementById('workTitle').textContent   = data.title;
    document.getElementById('workTitleEn').textContent = data.titleEn || '';
    renderBody();
  });

  function removeWork() {
    if (!confirm('確定要刪除這件作品嗎？此動作無法復原。')) return;
    const catId = currentWork.catId;
    workDelete(currentWork.id);
    location.href = catId ? 'category.html?id=' + catId : 'program.html';
  }

  function onAuthChange() { authRefreshUI(); }

  // Cursor
  const glowOuter = document.querySelector('.glow.outer');
  const glowInner = document.querySelector('.glow.inner');
  let tx = window.innerWidth/2, ty = window.innerHeight/2, ox = tx, oy = ty, ix = tx, iy = ty;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function animCursor() {
    ox += (tx-ox)*.08; oy += (ty-oy)*.08; ix += (tx-ix)*.16; iy += (ty-iy)*.16;
    glowOuter.style.left = ox+'px'; glowOuter.style.top = oy+'px';
    glowInner.style.left = ix+'px'; glowInner.style.top = iy+'px';
    requestAnimationFrame(animCursor);
  })();

  initPage();

  // ── 漢堡選單 ──────────────────────────────────────────────────────
  (function () {
    var btn = document.getElementById('navHamburger');
    var drawer = document.getElementById('navMobile');
    var backdrop = document.getElementById('navBackdrop');
    function openNav() { drawer.classList.add('open'); backdrop.classList.add('open'); btn.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    function closeNav() { drawer.classList.remove('open'); backdrop.classList.remove('open'); btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    btn.addEventListener('click', function () { drawer.classList.contains('open') ? closeNav() : openNav(); });
    backdrop.addEventListener('click', closeNav);
    drawer.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeNav); });
  })();
  </script>
</body>
</html>
