<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program — JIAXIN DESIGN STUDIOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="program.css" />
</head>
<body class="prog-page">

  <!-- Loading Screen -->
  <div id="loaderOverlay" class="loader-overlay">
    <canvas id="loaderCanvas"></canvas>
    <div class="loader-center">
      <img src="JX LOGO (1).png" alt="JIAXIN" class="loader-logo-img" />
      <div class="loader-brand">JIAXIN DESIGN STUDIOS</div>
      <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="JX LOGO (1).png" alt="JIA XIN DESIGN" />
      <div class="nav-brand">JIAXIN DESIGN<span>STUDIOS</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="program.html" class="active">Program</a></li>
      <li><a href="index.html#events">Events</a></li>
      <li><a href="index.html#community">Community</a></li>
    </ul>
    <button id="loginBtn" class="btn btn-outline">登入 Login</button>
  </nav>

  <!-- Page Header -->
  <header class="prog-header">
    <div class="prog-header-bg"></div>
    <div class="prog-header-content">
      <a href="index.html" class="prog-back-link">← Home</a>
      <span class="section-label">Portfolio</span>
      <h1 class="prog-title">PROGRAM<em>.</em></h1>
      <p class="prog-sub">作品集 · 每一顆泡泡，都是一個故事</p>
    </div>
  </header>

  <!-- Admin Toolbar -->
  <div class="prog-toolbar admin-only" style="display:none">
    <button class="btn btn-primary" onclick="openAddModal()">+ 新增專案</button>
    <span class="prog-toolbar-hint">管理員模式：可新增、編輯、刪除專案</span>
  </div>

  <!-- Bubble Canvas + Orbs -->
  <div class="prog-scene" id="progScene">
    <canvas id="progCanvas"></canvas>
    <div class="orbs-wrap" id="orbsWrap"></div>
  </div>

  <!-- All Works Preview Grid -->
  <section class="prog-allworks" id="progAllWorks">
    <div class="container">
      <div style="text-align:center;margin-bottom:24px">
        <span class="section-label">所有作品 / All Works</span>
        <div class="divider" style="margin:10px auto 0"></div>
      </div>
      <div class="prog-works-grid" id="progWorksGrid">
        <div class="prog-works-empty">尚無作品，請先進入分類新增作品。</div>
      </div>
    </div>
  </section>

  <!-- Add / Edit Modal -->
  <div class="prog-modal" id="projModal">
    <div class="prog-modal-box">
      <button class="prog-modal-close" onclick="closeAddModal()">✕</button>
      <h2 id="projModalTitle">新增專案</h2>
      <form id="projForm">
        <input type="hidden" id="projEditId" value="" />
        <div class="prog-field-row">
          <div class="prog-field">
            <label>中文標題 *</label>
            <input type="text" id="pTitle" placeholder="動態影音剪輯" required />
          </div>
          <div class="prog-field">
            <label>English Title *</label>
            <input type="text" id="pTitleEn" placeholder="Video Editing" required />
          </div>
        </div>
        <div class="prog-field-row">
          <div class="prog-field">
            <label>中文說明</label>
            <textarea id="pDesc" placeholder="專案說明…" rows="3"></textarea>
          </div>
          <div class="prog-field">
            <label>English Description</label>
            <textarea id="pDescEn" placeholder="Project description…" rows="3"></textarea>
          </div>
        </div>
        <div class="prog-field">
          <label>標籤 Tags（逗號分隔）</label>
          <input type="text" id="pTags" placeholder="Video, Motion, After Effects" />
        </div>
        <div class="prog-field">
          <label>主色 Color</label>
          <input type="color" id="pColor" value="#00eedd" />
        </div>
        <div class="prog-field">
          <label>圖片 URLs（每行一個）</label>
          <textarea id="pImages" placeholder="https://example.com/image1.jpg" rows="4"></textarea>
        </div>
        <div class="prog-field">
          <label>詳細內容 Content（HTML 可用）</label>
          <textarea id="pContent" placeholder="詳細介紹…" rows="5"></textarea>
        </div>
        <div class="prog-modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeAddModal()">取消</button>
          <button type="submit" class="btn btn-primary" id="projSaveBtn">儲存</button>
        </div>
      </form>
    </div>
  </div>
  <div class="prog-modal-backdrop" id="projModalBackdrop" onclick="closeAddModal()"></div>

  <!-- Login Modal -->
  <div class="auth-modal" id="loginModal">
    <div class="auth-modal-box">
      <button class="auth-close" onclick="closeLoginModal()">✕</button>
      <h2>管理員登入</h2>
      <p class="auth-sub">Admin Login</p>
      <form id="loginForm" autocomplete="off">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="new-password" required />
        </div>
        <div class="auth-field">
          <label>密碼 Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <div id="loginError" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">登入 Login</button>
      </form>
    </div>
  </div>

  <!-- Cursor -->
  <div class="cursor-glow-wrap">
    <div class="glow outer"></div>
    <div class="glow inner"></div>
  </div>

  <script src="sanitize.js"></script>
  <script src="jiaxin-core.js"></script>
  <script src="loader.js"></script>
  <script>
  // ── Program Page Logic ────────────────────────────────────────────

  // Convert hex color to rgba string
  function hexRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // Starfield background on canvas
  const progCanvas = document.getElementById('progCanvas');
  const pctx = progCanvas.getContext('2d');
  function resizeProgCanvas() {
    progCanvas.width  = progCanvas.offsetWidth;
    progCanvas.height = progCanvas.offsetHeight;
    drawStars();
  }
  function drawStars() {
    pctx.clearRect(0,0,progCanvas.width,progCanvas.height);
    for (let i = 0; i < 180; i++) {
      const x = Math.random() * progCanvas.width;
      const y = Math.random() * progCanvas.height;
      const r = Math.random() * 1.2;
      const a = 0.1 + Math.random() * 0.5;
      pctx.beginPath();
      pctx.arc(x, y, r, 0, Math.PI*2);
      pctx.fillStyle = `rgba(255,255,255,${a})`;
      pctx.fill();
    }
  }
  window.addEventListener('resize', resizeProgCanvas);
  setTimeout(resizeProgCanvas, 100);

  // ── Render Bubbles ────────────────────────────────────────────────
  let currentProjs = [];

  function renderBubbles() {
    currentProjs = getProjects();
    const wrap = document.getElementById('orbsWrap');
    wrap.innerHTML = '';

    currentProjs.forEach((proj, i) => {
      const orb = document.createElement('div');
      orb.className = 'orb-wrap';
      orb.style.setProperty('--delay', `${(i * 0.55) % 3}s`);
      orb.style.setProperty('--dur',   `${3.8 + (i * 0.7) % 2.5}s`);

      const clr    = sanitizeColor(proj.color || '#00aaff');
      const glow1  = hexRgba(clr, 0.45);
      const glow2  = hexRgba(clr, 0.20);
      const glow3  = hexRgba(clr, 0.08);
      const border = hexRgba(clr, 0.55);
      const inner  = hexRgba(clr, 0.18);
      const arcTop = hexRgba(clr, 0.85);

      orb.innerHTML = `
        <div class="orb-sphere"
          style="
            border-color:${border};
            box-shadow: 0 0 18px ${glow1}, 0 0 45px ${glow2}, 0 0 90px ${glow3}, inset 0 0 28px rgba(0,0,0,0.75);
            --arc-color: ${arcTop};
            --inner-glow: ${inner};
          "
          onclick="openProject('${proj.id}')"
          title="${sanitizeHTML(proj.title)}">
          <!-- Top arc highlight -->
          <div class="orb-arc" style="border-color:${arcTop}"></div>
          <!-- Content -->
          <div class="orb-content">
            <div class="orb-title" style="color:${clr}">${sanitizeHTML(proj.title)}</div>
            <div class="orb-title-en">${sanitizeHTML(proj.titleEn || '')}</div>
            <div class="orb-tags">
              ${(proj.tags||[]).slice(0,2).map(t=>`<span class="orb-tag" style="color:${clr};border-color:${hexRgba(clr,0.4)}">${sanitizeHTML(t)}</span>`).join('')}
            </div>
          </div>
          <!-- Bottom glow reflection -->
          <div class="orb-reflection" style="background:${hexRgba(clr,0.12)}"></div>
        </div>
        <!-- Admin controls -->
        <div class="orb-admin admin-only" style="display:none">
          <button onclick="event.stopPropagation();openEditModal('${proj.id}')">✏ 編輯</button>
          <button onclick="event.stopPropagation();deleteProj('${proj.id}')">✕ 刪除</button>
        </div>
      `;
      wrap.appendChild(orb);
    });

    authRefreshUI();
  }

  // ── Navigate to category page ─────────────────────────────────────
  function openProject(id) {
    window.location.href = 'category.html?id=' + id;
  }

  // ── Add / Edit Modal ──────────────────────────────────────────────
  function openAddModal() {
    document.getElementById('projModalTitle').textContent = '新增專案';
    document.getElementById('projSaveBtn').textContent = '新增';
    document.getElementById('projEditId').value = '';
    document.getElementById('projForm').reset();
    document.getElementById('projModal').classList.add('open');
    document.getElementById('projModalBackdrop').classList.add('open');
  }

  function openEditModal(id) {
    const proj = currentProjs.find(p => p.id === id);
    if (!proj) return;
    document.getElementById('projModalTitle').textContent = '編輯專案';
    document.getElementById('projSaveBtn').textContent = '儲存變更';
    document.getElementById('projEditId').value = id;
    document.getElementById('pTitle').value    = proj.title    || '';
    document.getElementById('pTitleEn').value  = proj.titleEn  || '';
    document.getElementById('pDesc').value     = proj.description || '';
    document.getElementById('pDescEn').value   = proj.descriptionEn || '';
    document.getElementById('pTags').value     = (proj.tags||[]).join(', ');
    document.getElementById('pColor').value    = proj.color || '#00aaff';
    document.getElementById('pImages').value   = (proj.images||[]).join('\n');
    document.getElementById('pContent').value  = proj.content || '';
    document.getElementById('projModal').classList.add('open');
    document.getElementById('projModalBackdrop').classList.add('open');
  }

  function closeAddModal() {
    document.getElementById('projModal').classList.remove('open');
    document.getElementById('projModalBackdrop').classList.remove('open');
  }

  document.getElementById('projForm').addEventListener('submit', e => {
    e.preventDefault();
    const editId = document.getElementById('projEditId').value;
    const data = {
      title:           document.getElementById('pTitle').value.trim(),
      titleEn:         document.getElementById('pTitleEn').value.trim(),
      description:     document.getElementById('pDesc').value.trim(),
      descriptionEn:   document.getElementById('pDescEn').value.trim(),
      tags:            document.getElementById('pTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      color:           document.getElementById('pColor').value,
      images:          document.getElementById('pImages').value.split('\n').map(s=>s.trim()).filter(Boolean),
      content:         document.getElementById('pContent').value.trim(),
    };
    if (editId) projUpdate(editId, data);
    else        projAdd(data);
    closeAddModal();
    renderBubbles();
  });

  function deleteProj(id) {
    if (!confirm('確定要刪除這個專案嗎？')) return;
    projDelete(id);
    renderBubbles();
  }

  // ── All Works Grid ────────────────────────────────────────────────
  function renderAllWorks() {
    const allWorks = getWorks();
    const cats     = getProjects();
    const grid     = document.getElementById('progWorksGrid');
    if (!grid) return;
    if (!allWorks.length) {
      grid.innerHTML = '<div class="prog-works-empty">尚無作品，請先進入各分類新增作品。</div>';
      return;
    }
    grid.innerHTML = allWorks.map(w => {
      const cat   = cats.find(c => c.id === w.catId) || {};
      const clr   = sanitizeColor(cat.color || '#00aaff');
      const thumb = sanitizeURL(w.thumb || '');
      return `
        <div class="prog-work-item" onclick="location.href='work.html?id=${w.id}'" style="--item-clr:${clr}">
          <div class="prog-work-thumb">
            ${thumb
              ? `<img src="${thumb}" alt="${sanitizeHTML(w.title)}" loading="lazy" />`
              : `<div class="prog-work-thumb-ph" style="background:linear-gradient(135deg,${hexRgba(clr,0.15)},${hexRgba(clr,0.04)})">✦</div>`}
            <div class="prog-work-overlay">
              <span class="prog-work-cat" style="color:${clr};border-color:${hexRgba(clr,0.4)}">${sanitizeHTML(cat.title || '')}</span>
            </div>
          </div>
          <div class="prog-work-name">${sanitizeHTML(w.title)}</div>
        </div>
      `;
    }).join('');
  }

  // ── Auth callback ─────────────────────────────────────────────────
  function onAuthChange() { renderBubbles(); renderAllWorks(); }

  // ── Cursor glow (same as main site) ──────────────────────────────
  const glowOuter = document.querySelector('.glow.outer');
  const glowInner = document.querySelector('.glow.inner');
  let tx = window.innerWidth/2, ty = window.innerHeight/2;
  let ox = tx, oy = ty, ix = tx, iy = ty;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function animCursor() {
    ox += (tx-ox)*0.08; oy += (ty-oy)*0.08;
    ix += (tx-ix)*0.16; iy += (ty-iy)*0.16;
    glowOuter.style.left = ox+'px'; glowOuter.style.top = oy+'px';
    glowInner.style.left = ix+'px'; glowInner.style.top = iy+'px';
    requestAnimationFrame(animCursor);
  })();

  // ── Init ──────────────────────────────────────────────────────────
  (async () => {
    await _dataReady;
    renderBubbles();
    renderAllWorks();
  })();
  </script>
</body>
</html>
