        </div>

        <div class="prog-field">
          <label>主色 Color</label>

        </div>
        <div class="prog-field">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <label style="margin-bottom:0">縮圖 URL THUMBNAIL</label>
            <button type="button" onclick="normField('pThumb')"

              整理路徑 ↺

            placeholder="image/project1/cover.jpg 或貼上完整路徑自動轉換"

        <!-- ── 資料夾快速導入 ── -->

            從本地資料夾導入圖片 Import from Local Folder
          </div>

            <input type="text" id="pFolderPath" class="fs-path-input" placeholder="image/project1/" autocomplete="off" />

              整理路徑 ↺
            </button>
          </div>
          <textarea id="pImages"
            placeholder="https://example.com/image1.jpg&#10;image/project1/photo.jpg"
            rows="4"
            onpaste="setTimeout(()=>normField('pImages'),0)"></textarea>

  <!-- Cursor -->

  <script src="sanitize.js"></script>
  <script src="jiaxin-core.js"></script>
  <script src="loader.js"></script>
  <script>
  // ── Path Normalizer ────────────────────────────────────────────────
  let _projectRoot = '';
  fetch('/api/root').then(r => r.json()).then(d => {
    _projectRoot = (d.root || '').replace(/\\+/g, '/').replace(/\/+$/, '');
  }).catch(() => {});

  function normalizePath(raw) {
    const p = (raw || '').trim();
    if (!p || /^https?:\/\//i.test(p)) return p;
    let s = p.replace(/\\/g, '/');
    // Strip known project root if loaded
    if (_projectRoot) {
      const root = _projectRoot.replace(/\\+/g, '/').replace(/\/+$/, '');
      if (s.toLowerCase().startsWith(root.toLowerCase()))
        return s.slice(root.length).replace(/^\/+/, '');
    }
    // Fallback: strip absolute Windows path up to and including the project folder
    const m = s.match(/^[A-Za-z]:\/(?:[^\/]+\/)*?claudecode\/(.+)$/i);
    if (m) return m[1];
    return s;
  }

  function normalizeLines(text) {
    return (text || '').split('\n').map(l => normalizePath(l)).filter(Boolean).join('\n');
  }

  function normField(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = el.tagName === 'TEXTAREA' ? normalizeLines(el.value) : normalizePath(el.value);
    el.style.borderColor = 'rgba(0,238,221,0.6)';
    setTimeout(() => { el.style.borderColor = ''; }, 900);
  }

  // If thumb value has no image extension, treat as folder and auto-pick first image
  async function smartThumb(id) {
    const el = document.getElementById(id);
    if (!el) return;
    let val = normalizePath(el.value);
    if (!val || /^https?:\/\//i.test(val)) { el.value = val; return; }
    if (!/\.(jpg|jpeg|png|gif|webp|svg|avif|bmp)$/i.test(val)) {
      try {
        const r = await fetch('/api/list-images?path=' + encodeURIComponent(val.replace(/\/?$/, '')));
        const d = await r.json();
        if (d.images && d.images.length) val = d.images[0].path;
      } catch {}
    }
    if (el.value !== val) {
      el.value = val;
      el.style.borderColor = 'rgba(0,238,221,0.6)';
      setTimeout(() => { el.style.borderColor = ''; }, 900);
    }
  }

  // ── Folder Scanner (Proj) ─────────────────────────────────────────
  let _pfsImages = [], _pfsSel = new Set();

  async function scanProjFolder() {
    const raw = (document.getElementById('pFolderPath').value || '').trim().replace(/^\/+/, '');
    const out = document.getElementById('pFolderResult');
    if (!raw) { out.innerHTML = '<div class="fs-status err">請輸入資料夾路徑</div>'; return; }
    out.innerHTML = '<div class="fs-status">⟳ 掃描中…</div>';
    try {
      const r = await fetch('/api/list-images?path=' + encodeURIComponent(raw));
      const d = await r.json();
      if (!d.images || !d.images.length) {
        out.innerHTML = '<div class="fs-status">📂 資料夾內找不到圖片（支援 jpg / png / gif / webp / svg）</div>';
        return;
      }
      _pfsImages = d.images;
      _pfsSel = new Set(_pfsImages.map((_,i) => i));
      _renderPFS();
    } catch(e) {
      out.innerHTML = `<div class="fs-status err">❌ ${e.message || '無法連線至伺服器'}</div>`;
    }
  }

  function _renderPFS() {
    const grid = _pfsImages.map((img, i) => `
      <div class="fs-img ${_pfsSel.has(i) ? 'sel' : ''}"
           onclick="pfsToggle(${i})" title="${img.name}">
        <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
        ${_pfsSel.has(i) ? '<span class="fs-check-badge">✓</span>' : ''}
        <span class="fs-img-name">${img.name}</span>
      </div>`).join('');
    document.getElementById('pFolderResult').innerHTML = `
      <div class="fs-status">✓ 找到 ${_pfsImages.length} 張圖片</div>
      <div class="fs-grid">${grid}</div>
      <div class="fs-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="pfsApply()">✓ 套用至圖片欄位</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="pfsAll()">全選</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="pfsClear()">取消全選</button>
      </div>
      <div class="fs-hint">單擊 = 選取／取消</div>`;
  }

  function pfsToggle(i) {
    if (_pfsSel.has(i)) _pfsSel.delete(i); else _pfsSel.add(i);
    _renderPFS();
  }
  function pfsAll()   { _pfsSel = new Set(_pfsImages.map((_,i)=>i)); _renderPFS(); }
  function pfsClear() { _pfsSel = new Set(); _renderPFS(); }

  function pfsApply() {
    if (!_pfsImages.length) return;
    const sel = [..._pfsSel].sort((a,b) => a-b);
    const paths = sel.map(i => _pfsImages[i].path);
    // Auto-fill thumbnail with first selected image if thumb is empty
    const thumbEl = document.getElementById('pThumb');
    if (thumbEl && !thumbEl.value.trim() && paths.length) {
      thumbEl.value = paths[0];
      thumbEl.style.borderColor = 'rgba(0,238,221,0.7)';
      setTimeout(() => { thumbEl.style.borderColor = ''; }, 1200);
    }
    const ta = document.getElementById('pImages');
    ta.value = paths.join('\n');
    ta.style.borderColor = 'rgba(0,238,221,0.7)';
    setTimeout(() => { ta.style.borderColor = ''; }, 1200);
  }

  // ── Thumbnail Library (image/img) ────────────────────────────────
  let _thumbLibCache = null;

  async function toggleThumbLib(targetId, panelId) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    if (_thumbLibCache === null) {
      panel.innerHTML = '<div class="fs-status">⟳ 載入縮圖庫…</div>';
      try {
        const r = await fetch('/api/list-images?path=image/img');
        const d = await r.json();
        _thumbLibCache = d.images || [];
      } catch { _thumbLibCache = []; }
    }
    renderThumbLib(targetId, panelId);
  }

  async function refreshThumbLib(targetId, panelId) {
    _thumbLibCache = null;
    const panel = document.getElementById(panelId);
    if (panel) panel.innerHTML = '<div class="fs-status">⟳ 重新整理…</div>';
    try {
      const r = await fetch('/api/list-images?path=image/img');
      const d = await r.json();
      _thumbLibCache = d.images || [];
    } catch { _thumbLibCache = []; }
    renderThumbLib(targetId, panelId);
  }

  function renderThumbLib(targetId, panelId) {
    const panel = document.getElementById(panelId);
    const curVal = (document.getElementById(targetId)?.value || '').trim();
    if (!_thumbLibCache?.length) {
      panel.innerHTML = `
        <div class="thumb-lib-header">
          <span class="fs-status" style="margin:0">📂 縮圖庫尚無圖片（請將圖片加入 image/img 資料夾）</span>
          <button type="button" class="thumb-lib-refresh" onclick="refreshThumbLib('${targetId}','${panelId}')">↺ 重新整理</button>
        </div>`;
      return;
    }
    panel.innerHTML = `
      <div class="thumb-lib-header">
        <span class="fs-status" style="margin:0">縮圖庫 — ${_thumbLibCache.length} 張圖片</span>
        <button type="button" class="thumb-lib-refresh" onclick="refreshThumbLib('${targetId}','${panelId}')">↺ 重新整理</button>
      </div>
      <div class="fs-grid">
        ${_thumbLibCache.map(img => `
          <div class="fs-img ${img.path === curVal ? 'thumb' : ''}"
               onclick="pickThumb('${img.path}','${targetId}','${panelId}')"
               title="${img.name}">
            <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
            ${img.path === curVal ? '<span class="fs-thumb-badge">已選</span>' : ''}
            <span class="fs-img-name">${img.name}</span>
          </div>`).join('')}
      </div>
      <div class="fs-hint">單擊圖片以設為縮圖</div>`;
  }

  function pickThumb(path, targetId, panelId) {
    const el = document.getElementById(targetId);
    if (el) {
      el.value = path;
      el.style.borderColor = 'rgba(0,238,221,0.7)';
      setTimeout(() => { el.style.borderColor = ''; }, 1200);
    }
    renderThumbLib(targetId, panelId);
  }

  // ── Program Page Logic ────────────────────────────────────────────

  // Convert hex color to rgba string
  function hexRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // Starfield background on canvas
  const progCanvas = document.getElementById('progCanvas');
  const pctx = progCanvas.getContext('2d');
  function resizeProgCanvas() {
    progCanvas.width  = progCanvas.offsetWidth;
    progCanvas.height = progCanvas.offsetHeight;
    drawStars();
  }
  function drawStars() {
    pctx.clearRect(0,0,progCanvas.width,progCanvas.height);
    for (let i = 0; i < 180; i++) {
      const x = Math.random() * progCanvas.width;
      const y = Math.random() * progCanvas.height;
      const r = Math.random() * 1.2;
      const a = 0.1 + Math.random() * 0.5;
      pctx.beginPath();
      pctx.arc(x, y, r, 0, Math.PI*2);
      pctx.fillStyle = `rgba(255,255,255,${a})`;
      pctx.fill();
    }
  }
  window.addEventListener('resize', resizeProgCanvas);
  setTimeout(resizeProgCanvas, 100);

  // ── Render Bubbles ────────────────────────────────────────────────
  let currentProjs = [];

  function renderBubbles() {
    currentProjs = getProjects();
    const wrap = document.getElementById('orbsWrap');
    wrap.innerHTML = '';

    currentProjs.forEach((proj, i) => {
      const orb = document.createElement('div');
      orb.className = 'orb-wrap';
      orb.style.setProperty('--delay', `${(i * 0.55) % 3}s`);
      orb.style.setProperty('--dur',   `${3.8 + (i * 0.7) % 2.5}s`);

      const clr    = sanitizeColor(proj.color || '#00aaff');
      const glow1  = hexRgba(clr, 0.45);
      const glow2  = hexRgba(clr, 0.20);
      const glow3  = hexRgba(clr, 0.08);
      const border = hexRgba(clr, 0.55);
      const inner  = hexRgba(clr, 0.18);
      const arcTop = hexRgba(clr, 0.85);

      orb.innerHTML = `
        <div class="orb-sphere"
          style="
            border-color:${border};
            box-shadow: 0 0 18px ${glow1}, 0 0 45px ${glow2}, 0 0 90px ${glow3}, inset 0 0 28px rgba(0,0,0,0.75);
            --arc-color: ${arcTop};
            --inner-glow: ${inner};
          "
          onclick="openProject('${proj.id}')"
          title="${sanitizeHTML(proj.title)}">
          <!-- Top arc highlight -->
          <div class="orb-arc" style="border-color:${arcTop}"></div>
          <!-- Content -->
          <div class="orb-content">
            <div class="orb-title" style="color:${clr}">${sanitizeHTML(proj.title)}</div>
            <div class="orb-title-en">${sanitizeHTML(proj.titleEn || '')}</div>
            <div class="orb-tags">
              ${(proj.tags||[]).slice(0,2).map(t=>`<span class="orb-tag" style="color:${clr};border-color:${hexRgba(clr,0.4)}">${sanitizeHTML(t)}</span>`).join('')}
            </div>
          </div>
          <!-- Bottom glow reflection -->
          <div class="orb-reflection" style="background:${hexRgba(clr,0.12)}"></div>
        </div>
        <!-- Admin controls -->
        <div class="orb-admin admin-only" style="display:none">
          <button onclick="event.stopPropagation();openEditModal('${proj.id}')">✏ 編輯</button>
          <button onclick="event.stopPropagation();deleteProj('${proj.id}')">✕ 刪除</button>
        </div>
      `;
      wrap.appendChild(orb);
    });

    authRefreshUI();
  }

  // ── Navigate to category page ─────────────────────────────────────
  function openProject(id) {
    window.location.href = 'category.html?id=' + id;
  }

  // ── Add / Edit Modal ──────────────────────────────────────────────
  function openAddModal() {
    document.getElementById('projModalTitle').textContent = '新增專案';
    document.getElementById('projSaveBtn').textContent = '新增';
    document.getElementById('projEditId').value = '';
    document.getElementById('projForm').reset();
    document.getElementById('projModal').classList.add('open');
    document.getElementById('projModalBackdrop').classList.add('open');
  }

  function openEditModal(id) {
    const proj = currentProjs.find(p => p.id === id);
    if (!proj) return;
    document.getElementById('projModalTitle').textContent = '編輯專案';
    document.getElementById('projSaveBtn').textContent = '儲存變更';
    document.getElementById('projEditId').value = id;
    document.getElementById('pTitle').value    = proj.title    || '';
    document.getElementById('pTitleEn').value  = proj.titleEn  || '';
    document.getElementById('pDesc').value     = proj.description || '';
    document.getElementById('pDescEn').value   = proj.descriptionEn || '';
    document.getElementById('pTags').value     = (proj.tags||[]).join(', ');
    document.getElementById('pColor').value    = proj.color || '#00aaff';
    document.getElementById('pThumb').value   = proj.thumb  || '';
    document.getElementById('pImages').value  = (proj.images||[]).join('\n');
    document.getElementById('pContent').value = proj.content || '';
    document.getElementById('projModal').classList.add('open');
    document.getElementById('projModalBackdrop').classList.add('open');
  }

  function closeAddModal() {
    document.getElementById('projModal').classList.remove('open');
    document.getElementById('projModalBackdrop').classList.remove('open');
  }

  document.getElementById('projForm').addEventListener('submit', e => {
    e.preventDefault();
    const editId = document.getElementById('projEditId').value;
    const data = {
      title:           document.getElementById('pTitle').value.trim(),
      titleEn:         document.getElementById('pTitleEn').value.trim(),
      description:     document.getElementById('pDesc').value.trim(),
      descriptionEn:   document.getElementById('pDescEn').value.trim(),
      tags:            document.getElementById('pTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      color:   document.getElementById('pColor').value,
      thumb:   normalizePath(document.getElementById('pThumb').value),
      images:  normalizeLines(document.getElementById('pImages').value).split('\n').map(s=>s.trim()).filter(Boolean),
      content: document.getElementById('pContent').value.trim(),
    };
    if (editId) projUpdate(editId, data);
    else        projAdd(data);
    closeAddModal();
    renderBubbles();
  });

  function deleteProj(id) {
    if (!confirm('確定要刪除這個專案嗎？')) return;
    projDelete(id);
    renderBubbles();
  }

  // ── All Works Grid ────────────────────────────────────────────────
  function renderAllWorks() {
    const allWorks = getWorks();
    const cats     = getProjects();
    const grid     = document.getElementById('progWorksGrid');
    if (!grid) return;
    if (!allWorks.length) {
      grid.innerHTML = '<div class="prog-works-empty">尚無作品，請先進入各分類新增作品。</div>';
      return;
    }
    grid.innerHTML = allWorks.map(w => {
      const cat   = cats.find(c => c.id === w.catId) || {};
      const clr   = sanitizeColor(cat.color || '#00aaff');
      const thumb = sanitizeURL(w.thumb || '');
      return `
        <div class="prog-work-item" onclick="location.href='work.html?id=${w.id}'" style="--item-clr:${clr}">
          <div class="prog-work-thumb">
            ${thumb
              ? `<img src="${thumb}" alt="${sanitizeHTML(w.title)}" loading="lazy" />`
              : `<div class="prog-work-thumb-ph" style="background:linear-gradient(135deg,${hexRgba(clr,0.15)},${hexRgba(clr,0.04)})">✦</div>`}
            <div class="prog-work-overlay">
              <span class="prog-work-cat" style="color:${clr};border-color:${hexRgba(clr,0.4)}">${sanitizeHTML(cat.title || '')}</span>
            </div>
          </div>
          <div class="prog-work-name">${sanitizeHTML(w.title)}</div>
        </div>
      `;
    }).join('');
  }

  // ── Auth callback ─────────────────────────────────────────────────
  function onAuthChange() { renderBubbles(); renderAllWorks(); }

  // ── Cursor glow (same as main site) ──────────────────────────────
  const glowOuter = document.querySelector('.glow.outer');
  const glowInner = document.querySelector('.glow.inner');
  let tx = window.innerWidth/2, ty = window.innerHeight/2;
  let ox = tx, oy = ty, ix = tx, iy = ty;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function animCursor() {
    ox += (tx-ox)*0.08; oy += (ty-oy)*0.08;
    ix += (tx-ix)*0.16; iy += (ty-iy)*0.16;
    glowOuter.style.left = ox+'px'; glowOuter.style.top = oy+'px';
    glowInner.style.left = ix+'px'; glowInner.style.top = iy+'px';
    requestAnimationFrame(animCursor);
  })();

  // ── Init ──────────────────────────────────────────────────────────
  (async () => {
    await _dataReady;
    renderBubbles();
    renderAllWorks();
  })();

  // ── 漢堡選單 ──────────────────────────────────────────────────────
  (function () {
    var btn = document.getElementById('navHamburger');
    var drawer = document.getElementById('navMobile');
    var backdrop = document.getElementById('navBackdrop');
    function openNav() { drawer.classList.add('open'); backdrop.classList.add('open'); btn.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    function closeNav() { drawer.classList.remove('open'); backdrop.classList.remove('open'); btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    btn.addEventListener('click', function () { drawer.classList.contains('open') ? closeNav() : openNav(); });
    backdrop.addEventListener('click', closeNav);
    drawer.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeNav); });
  })();
  </script>
</body>
</html>
