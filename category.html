      <button class="prog-modal-close" onclick="closeWorkModal()">✕</button>

            <label>作品名稱（中文）*</label>
            <input type="text" id="wTitle" placeholder="動態宣傳影片" required />

          <div class="prog-field">

        <!-- ── 資料夾快速導入 ── -->

        <div class="prog-field">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <label style="margin-bottom:0">縮圖 URL THUMBNAIL</label>
            <button type="button" onclick="normField('wThumb')"

            </button>
          </div>

            placeholder="image/Quason/photo.jpg 或貼上完整路徑自動轉換"
            onpaste="setTimeout(()=>normField('wThumb'),0)"

          <!-- Thumbnail Library -->
          <div class="thumb-lib">
            <button type="button" class="thumb-lib-btn" onclick="toggleThumbLib('wThumb','wThumbLib')">
              📷 從縮圖庫選取 Pick from Gallery

        <div class="prog-field">

            <label style="margin-bottom:0">圖片 URLS（每行一個）</label>
            <button type="button" onclick="normField('wImages')"
              style="font-size:10px;padding:2px 8px;background:rgba(0,238,221,0.08);border:1px solid rgba(0,238,221,0.25);border-radius:4px;color:#00eedd;cursor:pointer;white-space:nowrap">
              整理路徑 ↺
            </button>
          </div>
          <textarea id="wImages"
            placeholder="https://example.com/image1.jpg&#10;image/Quason/merck1.jpg"
            rows="4"
            onpaste="setTimeout(()=>normField('wImages'),0)"
            oninput="renderWImgPreview()"></textarea>

          <div class="thumb-lib">

              🖼 從內文圖庫選取 Pick from Content Gallery

          </div>
          <!-- Live preview -->
          <div id="wImgPreview" class="img-preview-grid"></div>
        </div>
        <div class="prog-field">
          <label>影音連結 Videos（每行一個，YouTube / Vimeo）</label>
          <textarea id="wVideos" placeholder="https://youtu.be/xxxx" rows="3"></textarea>
        </div>
        <div class="prog-field">
          <label>附件檔案 Files（格式：名稱|URL，每行一個）</label>
          <textarea id="wFiles" placeholder="設計稿|https://example.com/file.pdf" rows="3"></textarea>
        </div>
        <div class="prog-field">
          <label>標籤 Tags（逗號或換行分隔，留空則自動生成）</label>
          <input type="text" id="wTags" placeholder="Video, Motion, 3D（最多 3 個）" />

        <div class="prog-field">

  <!-- Cursor -->

  </div>

  <script src="sanitize.js"></script>
  <script src="jiaxin-core.js"></script>
  <script src="loader.js"></script>
  <script>
  // ── Path Normalizer ────────────────────────────────────────────────
  let _projectRoot = '';
  fetch('/api/root').then(r => r.json()).then(d => {
    _projectRoot = (d.root || '').replace(/\\+/g, '/').replace(/\/+$/, '');
  }).catch(() => {});

  function normalizePath(raw) {
    const p = (raw || '').trim();
    if (!p || /^https?:\/\//i.test(p)) return p;
    let s = p.replace(/\\/g, '/');
    if (_projectRoot) {
      const root = _projectRoot.replace(/\\+/g, '/').replace(/\/+$/, '');
      if (s.toLowerCase().startsWith(root.toLowerCase()))
        return s.slice(root.length).replace(/^\/+/, '');
    }
    // Fallback: strip Windows absolute path by finding project folder name
    const m = s.match(/^[A-Za-z]:\/(?:[^\/]+\/)*?claudecode\/(.+)$/i);
    if (m) return m[1];
    return s;
  }

  function normalizeLines(text) {
    return (text || '').split('\n').map(l => normalizePath(l)).filter(Boolean).join('\n');
  }

  function normField(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = el.tagName === 'TEXTAREA' ? normalizeLines(el.value) : normalizePath(el.value);
    el.style.borderColor = 'rgba(0,238,221,0.6)';
    setTimeout(() => { el.style.borderColor = ''; }, 900);
  }

  // If thumb value has no image extension, treat as folder and auto-pick first image
  async function smartThumb(id) {
    const el = document.getElementById(id);
    if (!el) return;
    let val = normalizePath(el.value);
    if (!val || /^https?:\/\//i.test(val)) { el.value = val; return; }
    if (!/\.(jpg|jpeg|png|gif|webp|svg|avif|bmp)$/i.test(val)) {
      try {
        const r = await fetch('/api/list-images?path=' + encodeURIComponent(val.replace(/\/?$/, '')));
        const d = await r.json();
        if (d.images && d.images.length) val = d.images[0].path;
      } catch {}
    }
    if (el.value !== val) {
      el.value = val;
      el.style.borderColor = 'rgba(0,238,221,0.6)';
      setTimeout(() => { el.style.borderColor = ''; }, 900);
    }
  }

  // ── Folder Scanner ────────────────────────────────────────────────
  let _fsImages = [], _fsThumbIdx = 0, _fsSel = new Set();

  async function scanWorkFolder() {
    const raw = (document.getElementById('wFolderPath').value || '').trim().replace(/^\/+/, '');
    const out = document.getElementById('wFolderResult');
    if (!raw) { out.innerHTML = '<div class="fs-status err">請輸入資料夾路徑</div>'; return; }
    out.innerHTML = '<div class="fs-status">⟳ 掃描中…</div>';
    try {
      const r = await fetch('/api/list-images?path=' + encodeURIComponent(raw));
      const d = await r.json();
      if (!d.images || !d.images.length) {
        out.innerHTML = '<div class="fs-status">📂 資料夾內找不到圖片（支援 jpg / png / gif / webp / svg）</div>';
        return;
      }
      _fsImages = d.images;
      _fsThumbIdx = 0;
      _fsSel = new Set(_fsImages.map((_,i) => i));
      _renderFS();
    } catch(e) {
      out.innerHTML = `<div class="fs-status err">❌ ${e.message || '無法連線至伺服器，請確認 serve.mjs 正在執行'}</div>`;
    }
  }

  function _renderFS() {
    const grid = _fsImages.map((img, i) => `
      <div class="fs-img ${_fsSel.has(i) ? 'sel' : ''} ${i === _fsThumbIdx ? 'thumb' : ''}"
           onclick="fsToggle(${i})" ondblclick="fsSetThumb(${i})" title="${img.name}">
        <img src="${img.url}" alt="${img.name}" loading="lazy"
             onerror="this.style.display='none'" />
        ${i === _fsThumbIdx ? '<span class="fs-thumb-badge">縮圖</span>' : ''}
        ${_fsSel.has(i) && i !== _fsThumbIdx ? '<span class="fs-check-badge">✓</span>' : ''}
        <span class="fs-img-name">${img.name}</span>
      </div>`).join('');
    document.getElementById('wFolderResult').innerHTML = `
      <div class="fs-status">✓ 找到 ${_fsImages.length} 張圖片</div>
      <div class="fs-grid">${grid}</div>
      <div class="fs-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="fsApply()">✓ 套用至作品欄位</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fsSelectAll()">全選</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fsClearSel()">取消全選</button>
      </div>
      <div class="fs-hint">單擊 = 選取／取消 &nbsp;·&nbsp; 雙擊 = 設為縮圖</div>`;
  }

  function fsToggle(i) {
    if (i === _fsThumbIdx) return;
    if (_fsSel.has(i)) _fsSel.delete(i); else _fsSel.add(i);
    _renderFS();
  }
  function fsSetThumb(i) { _fsThumbIdx = i; _fsSel.add(i); _renderFS(); }
  function fsSelectAll()  { _fsSel = new Set(_fsImages.map((_,i) => i)); _renderFS(); }
  function fsClearSel()   { _fsSel = new Set([_fsThumbIdx]); _renderFS(); }

  function fsApply() {
    if (!_fsImages.length) return;
    const thumbEl = document.getElementById('wThumb');
    thumbEl.value = _fsImages[_fsThumbIdx].path;
    const paths = [..._fsSel].sort((a,b)=>a-b).map(i => _fsImages[i].path);
    document.getElementById('wImages').value = paths.join('\n');
    ['wThumb','wImages'].forEach(id => {
      const el = document.getElementById(id);
      el.style.borderColor = 'rgba(0,238,221,0.7)';
      setTimeout(() => { el.style.borderColor = ''; }, 1200);
    });
  }

  // ── Thumbnail Library (image/img) ────────────────────────────────
  let _thumbLibCache = null;

  async function toggleThumbLib(targetId, panelId) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    if (_thumbLibCache === null) {
      panel.innerHTML = '<div class="fs-status">⟳ 載入縮圖庫…</div>';
      try {
        const r = await fetch('/api/list-images?path=image/img');
        const d = await r.json();
        _thumbLibCache = d.images || [];
      } catch { _thumbLibCache = []; }
    }
    renderThumbLib(targetId, panelId);
  }

  async function refreshThumbLib(targetId, panelId) {
    _thumbLibCache = null;
    const panel = document.getElementById(panelId);
    if (panel) panel.innerHTML = '<div class="fs-status">⟳ 重新整理…</div>';
    try {
      const r = await fetch('/api/list-images?path=image/img');
      const d = await r.json();
      _thumbLibCache = d.images || [];
    } catch { _thumbLibCache = []; }
    renderThumbLib(targetId, panelId);
  }

  function renderThumbLib(targetId, panelId) {
    const panel = document.getElementById(panelId);
    const curVal = (document.getElementById(targetId)?.value || '').trim();
    if (!_thumbLibCache?.length) {
      panel.innerHTML = `
        <div class="thumb-lib-header">
          <span class="fs-status" style="margin:0">📂 縮圖庫尚無圖片（請將圖片加入 image/img 資料夾）</span>
          <button type="button" class="thumb-lib-refresh" onclick="refreshThumbLib('${targetId}','${panelId}')">↺ 重新整理</button>
        </div>`;
      return;
    }
    panel.innerHTML = `
      <div class="thumb-lib-header">
        <span class="fs-status" style="margin:0">縮圖庫 — ${_thumbLibCache.length} 張圖片</span>
        <button type="button" class="thumb-lib-refresh" onclick="refreshThumbLib('${targetId}','${panelId}')">↺ 重新整理</button>
      </div>
      <div class="fs-grid">
        ${_thumbLibCache.map(img => `
          <div class="fs-img ${img.path === curVal ? 'thumb' : ''}"
               onclick="pickThumb('${img.path}','${targetId}','${panelId}')"
               title="${img.name}">
            <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
            ${img.path === curVal ? '<span class="fs-thumb-badge">已選</span>' : ''}
            <span class="fs-img-name">${img.name}</span>
          </div>`).join('')}
      </div>
      <div class="fs-hint">單擊圖片以設為縮圖</div>`;
  }

  function pickThumb(path, targetId, panelId) {
    const el = document.getElementById(targetId);
    if (el) {
      el.value = path;
      el.style.borderColor = 'rgba(0,238,221,0.7)';
      setTimeout(() => { el.style.borderColor = ''; }, 1200);
    }
    renderThumbLib(targetId, panelId);
  }

  // ── Content Image Library (image/contentimg) ──────────────────────
  let _contentLibCache = null;
  let _contentLibSel = new Set();

  async function toggleContentLib(panelId) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    if (_contentLibCache === null) {
      panel.innerHTML = '<div class="fs-status">⟳ 載入內文圖庫…</div>';
      try {
        const r = await fetch('/api/list-images?path=image/contentimg');
        const d = await r.json();
        _contentLibCache = d.images || [];
        // Pre-select only images already listed in wImages (edit mode sync)
        const _existingPaths = new Set(
          (document.getElementById('wImages')?.value || '')
            .split('\n').map(s => s.trim()).filter(Boolean)
        );
        _contentLibSel = new Set(
          _contentLibCache.map((img, i) => _existingPaths.has(img.path) ? i : -1).filter(i => i >= 0)
        );
      } catch { _contentLibCache = []; }
    }
    renderContentLib(panelId);
  }

  async function refreshContentLib(panelId) {
    _contentLibCache = null;
    _contentLibSel = new Set();
    const panel = document.getElementById(panelId);
    if (panel) panel.innerHTML = '<div class="fs-status">⟳ 重新整理…</div>';
    try {
      const r = await fetch('/api/list-images?path=image/contentimg');
      const d = await r.json();
      _contentLibCache = d.images || [];
      _contentLibSel = new Set(_contentLibCache.map((_,i) => i));
    } catch { _contentLibCache = []; }
    renderContentLib(panelId);
  }

  function renderContentLib(panelId) {
    const panel = document.getElementById(panelId);
    if (!_contentLibCache?.length) {
      panel.innerHTML = `
        <div class="thumb-lib-header">
          <span class="fs-status" style="margin:0">📂 內文圖庫尚無圖片（請將圖片加入 image/contentimg 資料夾）</span>
          <button type="button" class="thumb-lib-refresh" onclick="refreshContentLib('${panelId}')">↺ 重新整理</button>
        </div>`;
      return;
    }
    const grid = _contentLibCache.map((img, i) => `
      <div class="fs-img ${_contentLibSel.has(i) ? 'sel' : ''}"
           onclick="contentLibToggle(${i},'${panelId}')" title="${img.name}">
        <img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.style.display='none'" />
        ${_contentLibSel.has(i) ? '<span class="fs-check-badge">✓</span>' : ''}
        <span class="fs-img-name">${img.name}</span>
      </div>`).join('');
    panel.innerHTML = `
      <div class="thumb-lib-header">
        <span class="fs-status" style="margin:0">內文圖庫 — ${_contentLibCache.length} 張圖片</span>
        <button type="button" class="thumb-lib-refresh" onclick="refreshContentLib('${panelId}')">↺ 重新整理</button>
      </div>
      <div class="fs-grid">${grid}</div>
      <div class="fs-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="contentLibApply('wImages','${panelId}')">✓ 套用至圖片欄位</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="contentLibAll('${panelId}')">全選</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="contentLibClear('${panelId}')">取消全選</button>
      </div>
      <div class="fs-hint">單擊 = 選取／取消 &nbsp;·&nbsp; 套用後會取代圖片欄位現有內容</div>`;
  }

  function contentLibToggle(i, panelId) {
    if (_contentLibSel.has(i)) _contentLibSel.delete(i); else _contentLibSel.add(i);
    renderContentLib(panelId);
    _previewWFromGallery();
  }
  function contentLibAll(panelId)   { _contentLibSel = new Set(_contentLibCache.map((_,i)=>i)); renderContentLib(panelId); _previewWFromGallery(); }
  function contentLibClear(panelId) { _contentLibSel = new Set(); renderContentLib(panelId); _previewWFromGallery(); }

  function contentLibApply(targetId, panelId) {
    if (!_contentLibCache?.length) return;
    const paths = [..._contentLibSel].sort((a,b) => a-b).map(i => _contentLibCache[i].path);
    const ta = document.getElementById(targetId);
    if (ta) {
      ta.value = paths.join('\n');
      ta.style.borderColor = 'rgba(0,238,221,0.7)';
      setTimeout(() => { ta.style.borderColor = ''; }, 1200);
    }
    _previewWUrls(paths);
  }

  function _previewWFromGallery() {
    if (!_contentLibCache) return;
    const paths = [..._contentLibSel].sort((a,b)=>a-b).map(i => _contentLibCache[i].path);
    _previewWUrls(paths);
  }

  function renderWImgPreview() {
    const urls = (document.getElementById('wImages')?.value || '')
      .split('\n').map(s => normalizePath(s)).filter(Boolean);
    _previewWUrls(urls);
  }

  function _previewWUrls(urls) {
    const box = document.getElementById('wImgPreview');
    if (!box) return;
    if (!urls.length) { box.innerHTML = ''; return; }
    box.innerHTML = urls.map(url => {
      const safe = url.replace(/"/g, '%22');
      return `<div class="img-preview-item"><img src="${safe}" loading="lazy"
        onerror="this.parentElement.classList.add('broken')" /></div>`;
    }).join('');
  }

  // ── Category Page Logic ───────────────────────────────────────────

  function hexRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  const urlParams  = new URLSearchParams(window.location.search);
  const catId      = urlParams.get('id');
  let currentCat   = null;
  let currentWorks = [];
  let workPage     = 0;
  const PAGE_SIZE  = 6;

  // ── Init ──────────────────────────────────────────────────────────
  async function initPage() {
    await _dataReady;
    if (!catId) { location.href = 'program.html'; return; }
    const cats = getProjects();
    currentCat = cats.find(c => c.id === catId);
    if (!currentCat) { location.href = 'program.html'; return; }

    const clr     = currentCat.color || '#00aaff';
    const safeClr = sanitizeColor(clr);
    document.title = currentCat.title + ' — JIAXIN';

    document.getElementById('catTitle').textContent = currentCat.title;
    document.getElementById('catTitleEn').textContent = currentCat.titleEn || '';

    const dot = document.getElementById('catColorDot');
    dot.style.background = clr;
    dot.style.boxShadow  = `0 0 20px ${clr}`;

    document.getElementById('catTags').innerHTML = (currentCat.tags || [])
      .map(t => `<span class="orb-tag" style="color:${safeClr};border-color:${hexRgba(safeClr,0.4)}">${sanitizeHTML(t)}</span>`)
      .join('');

    document.documentElement.style.setProperty('--cat-color', clr);

    loadWorks();
    authRefreshUI();
  }

  // ── Works ─────────────────────────────────────────────────────────
  function loadWorks() {
    currentWorks = getWorks(catId);
    workPage = 0;
    renderWorks();
  }

  function renderWorks() {
    const start      = workPage * PAGE_SIZE;
    const pageWorks  = currentWorks.slice(start, start + PAGE_SIZE);
    const totalPages = Math.ceil(currentWorks.length / PAGE_SIZE);
    const list       = document.getElementById('worksList');
    const admin      = isAdmin();
    const clr        = currentCat ? (currentCat.color || '#00aaff') : '#00aaff';
    const safeClr    = sanitizeColor(clr);

    if (!currentWorks.length) {
      list.innerHTML = `<div class="works-empty">${
        admin ? '尚無作品，點擊上方「+ 新增作品」開始新增。' : '尚無作品 / No works yet'
      }</div>`;
      document.getElementById('catPagination').innerHTML = '';
      return;
    }

    list.innerHTML = pageWorks.map(w => {
      const tags       = (w.tags && w.tags.length) ? w.tags : autoGenerateTags(w);
      const thumb      = sanitizeURL(w.thumb || '');
      const desc       = sanitizeHTML(w.desc || w.descEn || '');
      const validFiles = (w.files  || []).filter(f => sanitizeURL(f.url || ''));
      const imgCount   = (w.images || []).filter(u => sanitizeURL(u)).length;
      const vidCount   = (w.videos || []).length;
      const hasMeta    = imgCount || vidCount || validFiles.length;

      return `
      <div class="work-card" onclick="location.href='work.html?id=${w.id}'" style="border-left-color:${safeClr}">
        <div class="work-thumb">
          ${thumb
            ? `<img src="${thumb}" alt="${sanitizeHTML(w.title)}" loading="lazy" />`
            : `<div class="work-thumb-placeholder">✦</div>`}
        </div>
        <div class="work-info">
          <div class="work-title-row">
            <div>
              <div class="work-title">${sanitizeHTML(w.title)}</div>
              ${w.titleEn ? `<div class="work-title-en">${sanitizeHTML(w.titleEn)}</div>` : ''}
              ${tags.length ? `<div class="work-auto-tags">${tags.map(t => `<span class="work-auto-tag" style="--tag-clr:${safeClr}">${sanitizeHTML(t)}</span>`).join('')}</div>` : ''}
            </div>
            ${admin ? `
            <div class="work-admin" onclick="event.stopPropagation()">
              <button onclick="openEditWorkModal('${w.id}')">✏ 編輯</button>
              <button class="del" onclick="deleteWork('${w.id}')">✕ 刪除</button>
            </div>` : ''}
          </div>
          <div class="work-glass">
            <p class="work-desc">${desc || '<span style="opacity:.4">（尚無簡介）</span>'}</p>
          </div>
          ${hasMeta ? `
          <div class="work-card-meta">
            ${imgCount ? `<span class="work-card-chip">🖼 ${imgCount} 張圖</span>` : ''}
            ${vidCount ? `<span class="work-card-chip">▶ ${vidCount} 部影片</span>` : ''}
            ${validFiles.map(f => `
              <a href="${sanitizeURL(f.url)}" target="_blank" rel="noopener noreferrer"
                 class="work-card-file" onclick="event.stopPropagation()">📎 ${sanitizeHTML(f.name)}</a>
            `).join('')}
          </div>` : ''}
        </div>
      </div>
    `}).join('');

    // Pagination
    const pag = document.getElementById('catPagination');
    if (totalPages <= 1) {
      pag.innerHTML = '';
    } else {
      pag.innerHTML = `
        <button class="cat-page-btn" onclick="goPage(${workPage - 1})" ${workPage === 0 ? 'disabled' : ''}>↑ 上一頁</button>
        <span class="cat-page-info">${workPage + 1} / ${totalPages}</span>
        <button class="cat-page-btn" onclick="goPage(${workPage + 1})" ${workPage >= totalPages - 1 ? 'disabled' : ''}>↓ 下一頁</button>
      `;
    }
  }

  function goPage(p) {
    workPage = p;
    renderWorks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Add / Edit Work Modal ─────────────────────────────────────────
  function openAddWorkModal() {
    document.getElementById('workModalTitle').textContent = '新增作品';
    document.getElementById('workSaveBtn').textContent    = '新增';
    document.getElementById('workEditId').value = '';
    document.getElementById('workForm').reset();
    _contentLibCache = null; _contentLibSel = new Set();
    const _clp = document.getElementById('wContentLib');
    if (_clp) _clp.style.display = 'none';
    _previewWUrls([]);
    document.getElementById('workModal').classList.add('open');
    document.getElementById('workModalBackdrop').classList.add('open');
  }

  function openEditWorkModal(id) {
    const w = currentWorks.find(x => x.id === id);
    if (!w) return;
    document.getElementById('workModalTitle').textContent = '編輯作品';
    document.getElementById('workSaveBtn').textContent    = '儲存變更';
    document.getElementById('workEditId').value  = id;
    document.getElementById('wTitle').value      = w.title   || '';
    document.getElementById('wTitleEn').value    = w.titleEn || '';
    document.getElementById('wThumb').value      = w.thumb   || '';
    document.getElementById('wDesc').value       = w.desc    || '';
    document.getElementById('wDescEn').value     = w.descEn  || '';
    document.getElementById('wImages').value  = (w.images || []).join('\n');
    document.getElementById('wVideos').value  = (w.videos || []).join('\n');
    document.getElementById('wFiles').value      = (w.files  || []).map(f => f.name + '|' + f.url).join('\n');
    document.getElementById('wTags').value       = (w.tags   || []).join(', ');
    document.getElementById('wContent').value    = w.content || '';
    // Reset content lib so it re-syncs to this work's images on next open
    _contentLibCache = null; _contentLibSel = new Set();
    const _clp = document.getElementById('wContentLib');
    if (_clp) _clp.style.display = 'none';
    renderWImgPreview();
    document.getElementById('workModal').classList.add('open');
    document.getElementById('workModalBackdrop').classList.add('open');
  }

  function closeWorkModal() {
    document.getElementById('workModal').classList.remove('open');
    document.getElementById('workModalBackdrop').classList.remove('open');
    const _clp = document.getElementById('wContentLib');
    if (_clp) _clp.style.display = 'none';
  }

  document.getElementById('workForm').addEventListener('submit', e => {
    e.preventDefault();
    const editId = document.getElementById('workEditId').value;
    const tagsRaw = document.getElementById('wTags').value.trim();
    const tagsArr = tagsRaw
      ? tagsRaw.split(/[,，\n]+/).map(t => t.trim()).filter(Boolean).slice(0, 3)
      : [];
    const data = {
      title:   document.getElementById('wTitle').value.trim(),
      titleEn: document.getElementById('wTitleEn').value.trim(),
      thumb:   normalizePath(document.getElementById('wThumb').value),
      desc:    document.getElementById('wDesc').value.trim(),
      descEn:  document.getElementById('wDescEn').value.trim(),
      images:  normalizeLines(document.getElementById('wImages').value).split('\n').map(s => s.trim()).filter(Boolean),
      videos:  document.getElementById('wVideos').value.split('\n').map(s => s.trim()).filter(Boolean),
      files:   parseFileList(document.getElementById('wFiles').value),
      tags:    tagsArr,
      content: document.getElementById('wContent').value.trim(),
    };
    if (!data.tags.length) data.tags = autoGenerateTags(data);
    if (editId) workUpdate(editId, data);
    else        workAdd(catId, data);
    closeWorkModal();
    loadWorks();
  });

  function deleteWork(id) {
    if (!confirm('確定要刪除這件作品嗎？')) return;
    workDelete(id);
    loadWorks();
  }

  // ── Auth callback ─────────────────────────────────────────────────
  function onAuthChange() { authRefreshUI(); renderWorks(); }

  // ── Cursor glow ───────────────────────────────────────────────────
  const glowOuter = document.querySelector('.glow.outer');
  const glowInner = document.querySelector('.glow.inner');
  let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  let ox = tx, oy = ty, ix = tx, iy = ty;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function animCursor() {
    ox += (tx - ox) * 0.08; oy += (ty - oy) * 0.08;
    ix += (tx - ix) * 0.16; iy += (ty - iy) * 0.16;
    glowOuter.style.left = ox + 'px'; glowOuter.style.top = oy + 'px';
    glowInner.style.left = ix + 'px'; glowInner.style.top = iy + 'px';
    requestAnimationFrame(animCursor);
  })();

  // Start
  initPage();

  // ── 漢堡選單 ──────────────────────────────────────────────────────
  (function () {
    var btn = document.getElementById('navHamburger');
    var drawer = document.getElementById('navMobile');
    var backdrop = document.getElementById('navBackdrop');
    function openNav() { drawer.classList.add('open'); backdrop.classList.add('open'); btn.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    function closeNav() { drawer.classList.remove('open'); backdrop.classList.remove('open'); btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    btn.addEventListener('click', function () { drawer.classList.contains('open') ? closeNav() : openNav(); });
    backdrop.addEventListener('click', closeNav);
    drawer.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeNav); });
  })();
  </script>
</body>
</html>
